[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "exw"
version = "0.1.0"
description = "Offline detection and flagging of Enset Xanthomonas Wilt in wide-view farm images: quantized CNN for smartphone and FPGA (AAU BSc thesis)"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "numpy",
  "scipy",
  "pandas",
  "pyyaml",
  "pillow",
  "opencv-python-headless",
  "matplotlib",
  "scikit-learn",
  "imagehash",
]

[project.optional-dependencies]
tf = ["tensorflow-cpu"]
dev = ["pytest", "ruff"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["tf: tests that need TensorFlow (skipped in light CI)"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B"]
ignore = ["E501", "E731", "E702", "E701", "E741", "B905", "B007"]
